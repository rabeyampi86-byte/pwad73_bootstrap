<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS -->
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h3>Simple Form</h3>
    <form action="" class="form">
        <div class="form-group">
            <label for="">Name</label>
            <input type="text" name="name" placeholder="Enter Name" class="form-control">
        </div>
        <div class="form-group">
            <label for="">Address</label>
            <textarea name="address" placeholder="Enter address" class="form-control"></textarea>
        </div>
        <div class="form-group">
            <label for="">Date of Birth</label>
            <input type="date" class="form-control">
        </div>
        <div class="form-group">
            <label for="">File Import</label>
            <input type="file" class="form-control">
        </div>
        <div class="form-group">
            <label>
            <input type="checkbox">Check me out
            </label>
        </div>
        <div class="form-group">
            <label>Gender:</label><br>
            <input type="radio" name="gender" value="m">Male
            <input type="radio" name="gender" value="f">Female
            <input type="radio" name="gender" value="o">Others
        </div> 
        <div class="form-group">
            <label>Division:</label> <br>
            <select name="devision" class="form-control">
                <option value="1">Select Division</option>
                <option value="1">Dhaka</option>
                <option value="2">Khulna</option>
                <option value="3">Barisal</option>
                <option value="4">Chattagram</option>
            </select>
        </div>
         <div class="form-group">
            <input type="reset" name="reset" value="Reset"> 
        </div>
        <button class="btn btn-primary">Submit</button>
    </form>
    </div>
    <!-- JQuery -->
     <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Bootstrap JS -->
     <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    
</body>
</html>
