<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS -->
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <!-- Trigger the modal with a button -->
        <button type="button" class="btn btn-info btn-lg" data-toggle="modal" data-target="#mybox">Click Here</button>

        <!-- Modal -->
        <div class="modal fade" id="mybox" role="dialog">
            <div class="modal-dialog">
    
         <!-- Modal content-->
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal"></button>
                            <h4 class="modal-title">Modal Header</h4>
                    </div>
                         <div class="modal-body">
                            <form action="">
                                <input type="text" class="form-control" placeholder="Enter your name"><br>
                                <input type="text" class="form-control" placeholder="Enter your address"><br>
                                <label for="">Gender</label>
                                <select>
                                    <option value="">Male</option>
                                    <option value="">Female</option>
                                </select> <br>
                                <input type="file" class="form-control"> <br>
                                <button>Submit</button>
                            </form>
                         </div>
                             <div class="modal-footer">
                                <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                             </div>
                        </div>
                    </div>
                </div>
            </div>
  
        </div>
    </div>
    <!-- JQuery -->
     <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Bootstrap JS -->
     <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    
</body>
</html>
