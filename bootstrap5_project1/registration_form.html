<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card shadow-lg rounded-4 border-0">
                    <div class="card-header bg-primary text-white rounded-top-4 py-4">
                        <h3 class="card-title mb-0 text-center fw-bold">Student Registration Form</h3>
                    </div>
                    <div class="card-body p-5">
                        <form action="" method="POST" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="firstName" class="form-label fw-semibold">First Name:</label>
                                    <input type="text" class="form-control form-control-lg" id="firstName" name="name" placeholder="Enter Your First Name" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="lastName" class="form-label fw-semibold">Last Name:</label>
                                    <input type="text" class="form-control form-control-lg" id="lastName" name="lastname" placeholder="Enter Your Last Name" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="dateInput" class="form-label fw-semibold">Date:</label>
                                    <input type="date" class="form-control form-control-lg" id="dateInput" name="date" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="emailInput" class="form-label fw-semibold">E-mail Id:</label>
                                    <input type="email" class="form-control form-control-lg" id="emailInput" name="email" placeholder="Enter Your Email Id" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="mobileInput" class="form-label fw-semibold">Mobile:</label>
                                    <input type="tel" class="form-control form-control-lg" id="mobileInput" name="Mobile" placeholder="Enter your mobile number" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold d-block">Gender:</label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="gender" value="m" id="genderMale">
                                        <label class="form-check-label" for="genderMale">Male</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="gender" value="f" id="genderFemale">
                                        <label class="form-check-label" for="genderFemale">Female</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="countrySelect" class="form-label fw-semibold">Country:</label>
                                    <select class="form-select form-select-lg" id="countrySelect" name="country" required>
                                        <option value="">Select a Country</option>
                                        <option value="Bangladesh">Bangladesh</option>
                                        <option value="India">India</option>
                                        <option value="Pakistan">Pakistan</option>
                                        <option value="Japan">Japan</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="stateSelect" class="form-label fw-semibold">State:</label>
                                    <select class="form-select form-select-lg" id="stateSelect" name="state" required>
                                        <option value="">Select a State</option>
                                        <option value="New York">New York</option>
                                        <option value="California">California</option>
                                        <option value="Florida">Florida</option>
                                        <option value="Hawaii">Hawaii</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="addressInput" class="form-label fw-semibold">Address:</label>
                                    <input type="text" class="form-control form-control-lg" id="addressInput" name="address" placeholder="Enter Your Address" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="postcodeInput" class="form-label fw-semibold">Post Code:</label>
                                    <input type="text" class="form-control form-control-lg" id="postcodeInput" name="PC" placeholder="Enter Your Post Code" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="cityInput" class="form-label fw-semibold">City:</label>
                                    <input type="text" class="form-control form-control-lg" id="cityInput" name="city" placeholder="Enter Your City" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="districtSelect" class="form-label fw-semibold">District:</label>
                                    <select class="form-select form-select-lg" id="districtSelect" name="District" required>
                                        <option value="">Select a District</option>
                                        <option value="Dhaka">Dhaka</option>
                                        <option value="Comilla">Comilla</option>
                                        <option value="Fani">Fani</option>
                                        <option value="Brahmanbaria">Brahmanbaria</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label for="hobbiesInput" class="form-label fw-semibold">Hobbies:</label>
                                    <textarea class="form-control form-control-lg" id="hobbiesInput" name="hobbies" rows="4" placeholder="Enter Your Hobbies"></textarea>
                                </div>
                                <div class="col-12 d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                    <button type="reset" class="btn btn-outline-secondary btn-lg">Clear</button>
                                    <button type="submit" class="btn btn-primary btn-lg fw-bold">Submit</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
